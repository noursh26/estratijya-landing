<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333;display:flex;flex-direction:column;gap:8px}canvas{width:100%;display:block}</style></head><body>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';
const doc = await pdfjs.getDocument({url:'../uploads/str-profile.pdf'}).promise;
window.__n = doc.numPages;
for(let i=1;i<=doc.numPages;i++){
  const page = await doc.getPage(i);
  const vp = page.getViewport({scale:1.4});
  const c = document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.id='p'+i;
  document.body.appendChild(c);
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
}
window.__done = true;
</script></body></html>
