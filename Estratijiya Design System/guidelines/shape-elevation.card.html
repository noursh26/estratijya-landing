<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Shadows are soft and neutral; dark surfaces use a hairline instead" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-2xs,11px)/1.2 var(--font-core);font-size:10px}.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="gap:16px"><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><div style="font-size:9px;color:var(--text-muted);margin-top:8px">xs</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div style="font-size:9px;color:var(--text-muted);margin-top:8px">sm · card</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><div style="font-size:9px;color:var(--text-muted);margin-top:8px">md · hover</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><div style="font-size:9px;color:var(--text-muted);margin-top:8px">lg · overlay</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-dark);border-radius:var(--radius-card);box-shadow:var(--inset-hairline)"></div><div style="font-size:9px;color:var(--text-muted);margin-top:8px">inset-hairline</div></div></div></body></html>
