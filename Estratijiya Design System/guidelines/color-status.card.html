<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Status (derived)</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-2xs,11px)/1.2 var(--font-core);font-size:10px}.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div class="g"><div class="sw" style="background:var(--status-success);color:#031B1C">success</div><div class="sw" style="background:var(--status-warning);color:#031B1C">warning</div><div class="sw" style="background:var(--status-danger);color:#EDF4F1">danger</div></div></body></html>
