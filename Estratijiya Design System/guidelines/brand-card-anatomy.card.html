<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card anatomy</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-2xs,11px)/1.2 var(--font-core);font-size:10px}.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:24px;display:grid;gap:12px"><span style="font:var(--type-h3);color:var(--text-heading)">Studies &amp; Strategy</span><p style="color:var(--text-muted)">Set the foundation. We study your reality, define the goal, and design the strategy that gets you there.</p><span style="font:var(--type-small);font-weight:600;color:var(--green-600)">Learn more →</span></div>
<div style="background:var(--surface-accent);border-radius:var(--radius-card);padding:24px;display:grid;gap:12px"><span style="font:var(--type-h3);color:var(--text-on-accent)">Personal Branding</span><p style="color:rgba(3,27,28,.78)">The founder is the first impression. We turn visibility into a long-term commercial asset.</p><span style="font:var(--type-small);font-weight:600;color:var(--text-on-accent)">Learn more →</span></div></div></body></html>
