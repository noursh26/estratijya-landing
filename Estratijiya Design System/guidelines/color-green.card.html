<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Growth green</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-2xs,11px)/1.2 var(--font-core);font-size:10px}.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div class="g"><div class="sw" style="background:var(--green-100);color:#12403C">100</div><div class="sw" style="background:var(--green-200);color:#12403C">200</div><div class="sw" style="background:var(--green-300);color:#12403C">300</div><div class="sw" style="background:var(--green-400);color:#031B1C">400</div><div class="sw" style="background:var(--green-500);color:#031B1C">500</div><div class="sw" style="background:var(--green-600);color:#031B1C">600</div><div class="sw" style="background:var(--green-700);color:#EDF4F1">700</div></div></body></html>
