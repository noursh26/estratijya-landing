<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Where each ground is used" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-2xs,11px)/1.2 var(--font-core);font-size:10px}.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="height:96px;border-radius:var(--radius-card);background:var(--surface-page);border:1px solid var(--border-subtle);padding:8px"><span class="cap">surface-page</span></div>
<div style="height:96px;border-radius:var(--radius-card);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-card);padding:8px"><span class="cap">surface-card</span></div>
<div style="height:96px;border-radius:var(--radius-card);background:var(--surface-dark);padding:8px"><span class="cap" style="color:var(--text-on-dark-muted)">surface-dark</span></div>
<div style="height:96px;border-radius:var(--radius-card);background:var(--surface-ink);padding:8px"><span class="cap" style="color:var(--text-on-dark-muted)">surface-ink</span></div></div></body></html>
