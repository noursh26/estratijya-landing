<!-- @dsCard group="Spacing" viewport="700x220" name="Section rhythm" subtitle="128px section padding, 64px desktop gutter, 24px card gaps" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Section rhythm</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-2xs,11px)/1.2 var(--font-core);font-size:10px}.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div style="border:1px dashed var(--border-strong);border-radius:var(--radius-card);padding:0 24px">
<div style="height:32px;background:repeating-linear-gradient(45deg,var(--green-100),var(--green-100) 6px,transparent 6px,transparent 12px)"></div>
<div class="stack" style="padding-block:16px"><span style="font:var(--type-eyebrow);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-accent)">Section</span><h3 style="margin:0">Heading sits 16px under the eyebrow</h3><p style="color:var(--text-muted);max-inline-size:var(--measure)">Body sits 16px under the heading; the grid below starts 48px lower.</p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:32px"><div style="height:36px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card)"></div><div style="height:36px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card)"></div><div style="height:36px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card)"></div></div></div>
<div style="height:32px;background:repeating-linear-gradient(45deg,var(--green-100),var(--green-100) 6px,transparent 6px,transparent 12px)"></div></div></body></html>
