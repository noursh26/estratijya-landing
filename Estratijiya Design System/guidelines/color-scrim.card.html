<!-- @dsCard group="Colors" viewport="700x160" name="Protection gradients" subtitle="Ink scrims — never a blur — under type on photography" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Protection gradients</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-2xs,11px)/1.2 var(--font-core);font-size:10px}.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="position:relative;height:120px;border-radius:var(--radius-media);overflow:hidden;background:url(../assets/city.png) center/cover"><div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div><span style="position:absolute;inset-inline-start:12px;inset-block-end:10px;color:var(--text-on-dark);font-weight:600">scrim-bottom</span></div>
<div style="position:relative;height:120px;border-radius:var(--radius-media);overflow:hidden;background:url(../assets/corridor.png) center/cover"><div style="position:absolute;inset:0;background:var(--scrim-start)"></div><span style="position:absolute;inset-inline-start:12px;inset-block-end:10px;color:var(--text-on-dark);font-weight:600">scrim-start</span></div></div></body></html>
