<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Method</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="slides.css"><style>html,body{margin:0;background:var(--surface-ink)}</style></head><body>
<div class="slide dark">
  <div style="display:grid;grid-template-columns:1.15fr .85fr;height:100%">
    <div class="pad" style="justify-content:center;gap:20px">
      <h2 class="s">كيف نعمل؟ أربع خطوات</h2>
      <div style="display:grid;gap:16px">
        <div style="display:flex;gap:16px;align-items:flex-start"><span style="flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-pill);border:1px solid var(--border-on-dark);display:grid;place-items:center;color:var(--green-500);font-weight:700;font-size:20px">١</span><div><div style="font-size:24px;font-weight:700">نُشخّص</div><div class="muted" style="font-size:19px;line-height:1.7">لا نبدأ من الطلب، بل من السبب. نسأل «لماذا» حتى نصل إليه.</div></div></div><div style="display:flex;gap:16px;align-items:flex-start"><span style="flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-pill);border:1px solid var(--border-on-dark);display:grid;place-items:center;color:var(--green-500);font-weight:700;font-size:20px">٢</span><div><div style="font-size:24px;font-weight:700">نُخطّط</div><div class="muted" style="font-size:19px;line-height:1.7">قرارٌ مبنيٌّ على ما وجدناه — ولكل خطوةٍ صاحبها وموعدها ومقياسها.</div></div></div><div style="display:flex;gap:16px;align-items:flex-start"><span style="flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-pill);border:1px solid var(--border-on-dark);display:grid;place-items:center;color:var(--green-500);font-weight:700;font-size:20px">٣</span><div><div style="font-size:24px;font-weight:700">ننفّذ</div><div class="muted" style="font-size:19px;line-height:1.7">بأيدينا، وبأقسامنا، من أول خطوةٍ إلى آخرها.</div></div></div><div style="display:flex;gap:16px;align-items:flex-start"><span style="flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-pill);border:1px solid var(--border-on-dark);display:grid;place-items:center;color:var(--green-500);font-weight:700;font-size:20px">٤</span><div><div style="font-size:24px;font-weight:700">نقيس ونُعدّل</div><div class="muted" style="font-size:19px;line-height:1.7">ما أثمر يُوسَّع، وما تعثّر يُعدَّل — بقرارٍ مبنيٍّ على رقم.</div></div></div>
      </div>
    </div>
    <div style="background:url(../../assets/puzzle.png) center/cover"></div>
  </div>
</div></body></html>
