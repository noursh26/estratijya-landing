<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Values</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="slides.css"><style>html,body{margin:0;background:var(--surface-ink)}</style></head><body>
<div class="slide">
  <div style="display:grid;grid-template-columns:.5fr 1.5fr;height:100%">
    <div style="background:url(../../assets/corridor.png) center/cover"></div>
    <div class="pad" style="justify-content:center;gap:0;text-align:center;align-items:center">
      <h2 class="s" style="margin-bottom:16px">قيمنا</h2>
      <div style="width:min(560px,100%)">
      <div style="padding:12px 0;"><div style="font-size:22px;font-weight:700">الوضوح</div><div class="muted" style="font-size:19px">نقول ما وجدناه، لا ما يُراد سماعه.</div></div><div style="padding:12px 0;border-top:1px solid var(--border-on-dark)"><div style="font-size:22px;font-weight:700">الهيكلة</div><div class="muted" style="font-size:19px">لكل شيءٍ مكان، ولكل مهمةٍ صاحب.</div></div><div style="padding:12px 0;border-top:1px solid var(--border-on-dark)"><div style="font-size:22px;font-weight:700">الإتقان</div><div class="muted" style="font-size:19px">ما يخرج باسمنا، يُقاس بأعلى معيار.</div></div><div style="padding:12px 0;border-top:1px solid var(--border-on-dark)"><div style="font-size:22px;font-weight:700">الشراكة</div><div class="muted" style="font-size:19px">نجاحك هو المقياس، لا تسليم المهمة.</div></div><div style="padding:12px 0;border-top:1px solid var(--border-on-dark)"><div style="font-size:22px;font-weight:700">المسؤولية</div><div class="muted" style="font-size:19px">نقول ما سنفعله، ونفعل ما قلناه.</div></div><div style="padding:12px 0;border-top:1px solid var(--border-on-dark)"><div style="font-size:22px;font-weight:700">النمو</div><div class="muted" style="font-size:19px">كل ما نبنيه، يُبنى ليكبر.</div></div>
      </div>
    </div>
  </div>
</div></body></html>
